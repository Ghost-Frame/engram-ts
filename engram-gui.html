<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engram</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#c8ccd4;font-family:'Inter',sans-serif;overflow:hidden;height:100vh}
canvas#bg-canvas{position:fixed;top:0;left:0;display:block;pointer-events:none}
canvas#graph{position:fixed;top:0;left:0;display:block;cursor:grab}
canvas#graph.grabbing{cursor:grabbing}

/* Glass mixin */
.glass{background:rgba(15,20,25,0.75);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,0.06);box-shadow:0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.04)}

/* Topbar */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(10,10,12,0.85);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border-bottom:1px solid rgba(255,255,255,0.06);box-shadow:0 4px 30px rgba(0,0,0,0.4)}
#topbar h1{font-size:15px;font-weight:700;color:#e2e4e9;letter-spacing:1.5px;white-space:nowrap;text-transform:uppercase}
#topbar h1 span{background:linear-gradient(135deg,#7b8fff 0%,#b28dff 50%,#c084fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-glow{display:inline-block;filter:drop-shadow(0 0 8px rgba(129,140,248,0.3))}

/* Search */
#search-box{flex:1;max-width:380px;position:relative}
#search-box input{width:100%;padding:8px 14px 8px 34px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e2e4e9;font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:all 0.3s ease}
#search-box input:focus{border-color:rgba(129,140,248,0.4);background:rgba(255,255,255,0.07);box-shadow:0 0 0 3px rgba(129,140,248,0.08)}
#search-box input::placeholder{color:rgba(255,255,255,0.25)}
#search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:14px;pointer-events:none}

/* Stats */
.stats{display:flex;gap:14px;align-items:center;font-size:11px;color:rgba(255,255,255,0.4);white-space:nowrap}
.stats .num{color:#b28dff;font-weight:600;font-family:'JetBrains Mono',monospace}

/* Topbar buttons */
.tb-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:rgba(255,255,255,0.5);padding:6px 10px;font-size:12px;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;gap:6px;position:relative}
.tb-btn:hover{background:rgba(255,255,255,0.08);color:#e2e4e9}
.tb-btn.active{background:rgba(129,140,248,0.15);border-color:rgba(129,140,248,0.3);color:#818cf8}
#inbox-badge{position:absolute;top:-5px;right:-5px;background:#f87171;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;display:none;line-height:1.4}

/* Loading overlay */
#loading{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.5s ease}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid rgba(129,140,248,0.15);border-top-color:#818cf8;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .text{font-size:13px;color:rgba(255,255,255,0.4)}

/* Navigation controls (bottom-left, above legend) */
#nav-controls{position:fixed;bottom:80px;left:20px;z-index:50;display:flex;flex-direction:column;gap:6px}
#nav-controls button{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(15,20,35,0.85);backdrop-filter:blur(12px);color:rgba(255,255,255,0.5);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all 0.2s ease;white-space:nowrap}
#nav-controls button:hover{background:rgba(255,255,255,0.1);color:#e2e4e9}

/* Legend (bottom-left, collapsible) */
#legend-wrap{position:fixed;bottom:20px;left:20px;z-index:50}
#legend-toggle{background:rgba(15,20,35,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:rgba(255,255,255,0.5);padding:6px 12px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s ease;font-family:'Inter',sans-serif}
#legend-toggle:hover{background:rgba(255,255,255,0.1);color:#e2e4e9}
#legend-toggle .arrow{transition:transform 0.2s ease;font-size:8px}
#legend-toggle.open .arrow{transform:rotate(180deg)}
#legend{padding:10px 14px;border-radius:12px;display:none;flex-wrap:wrap;gap:8px 14px;max-width:300px;font-size:10px;margin-bottom:6px;background:rgba(15,20,35,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08)}
#legend.open{display:flex}
#legend .item{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.45)}
#legend .dot{width:8px;height:8px;border-radius:50%}

/* Timeline bar (bottom, full width) */
#timeline-bar{position:fixed;bottom:0;left:0;right:0;z-index:90;padding:8px 20px;background:rgba(10,14,30,0.92);backdrop-filter:blur(20px);border-top:1px solid rgba(100,80,200,0.08);display:none;align-items:center;gap:12px;height:38px}
#timeline-bar.active{display:flex}
#timeline-slider{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.08);border-radius:2px;outline:none;cursor:pointer}
#timeline-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#818cf8;cursor:pointer;box-shadow:0 0 8px rgba(129,140,248,0.4)}
#timeline-date{font-size:11px;color:rgba(255,255,255,0.5);font-family:'JetBrains Mono',monospace;min-width:90px;text-align:center}
#timeline-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:rgba(255,255,255,0.5);padding:4px 10px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
#timeline-btn:hover{background:rgba(255,255,255,0.1);color:#e2e4e9}
#timeline-count{font-size:10px;color:rgba(255,255,255,0.3);min-width:60px;text-align:right}

/* Sidebar (right slide-in) */
#sidebar{position:fixed;top:52px;right:0;bottom:0;width:380px;z-index:80;transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;padding:0;background:rgba(10,14,20,0.92);backdrop-filter:blur(30px);border-left:1px solid rgba(255,255,255,0.04)}
#sidebar.open{transform:translateX(0)}
#sidebar .sb-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between}
#sidebar .sb-header h2{font-size:13px;font-weight:600;color:#e2e4e9}
#sidebar .sb-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer;padding:4px;line-height:1}
#sidebar .sb-close:hover{color:#e2e4e9}
#sidebar .sb-body{padding:16px 20px}
.sb-field{margin-bottom:14px}
.sb-field label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:rgba(255,255,255,0.35);display:block;margin-bottom:4px}
.sb-field .value{font-size:13px;color:#e2e4e9;line-height:1.6}
.sb-field .content{font-size:12px;color:rgba(255,255,255,0.7);line-height:1.7;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;max-height:300px;overflow-y:auto;padding:10px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.04)}
.sb-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.sb-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.sb-meta-item{font-size:11px;color:rgba(255,255,255,0.4);display:flex;align-items:center;gap:4px}
.sb-meta-item .val{color:rgba(255,255,255,0.7)}
.sb-links-list{list-style:none;padding:0}
.sb-links-list li{padding:6px 8px;font-size:11px;color:rgba(255,255,255,0.5);cursor:pointer;border-radius:6px;transition:background 0.15s ease;display:flex;align-items:center;gap:8px}
.sb-links-list li:hover{background:rgba(255,255,255,0.04);color:#e2e4e9}
.sb-links-list .link-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.sb-actions{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.04)}
.sb-actions button{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.2s ease}
.sb-actions button:hover{background:rgba(255,255,255,0.08);color:#e2e4e9}
.sb-actions .danger{border-color:rgba(248,113,113,0.2);color:#f87171}
.sb-actions .danger:hover{background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.4)}

/* Inbox panel (left slide-in) */
#inbox-panel{position:fixed;top:52px;left:0;bottom:0;width:400px;z-index:80;transform:translateX(-100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;background:rgba(10,14,20,0.92);backdrop-filter:blur(30px);border-right:1px solid rgba(255,255,255,0.04)}
#inbox-panel.open{transform:translateX(0)}
#inbox-panel .ib-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between}
#inbox-panel .ib-header h2{font-size:13px;font-weight:600;color:#e2e4e9;display:flex;align-items:center;gap:8px}
#inbox-count{font-size:11px;color:rgba(255,255,255,0.35);font-weight:400}
.ib-bulk{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,0.04)}
.ib-bulk button{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:10px;font-weight:500;cursor:pointer;transition:all 0.2s ease}
.ib-bulk button:hover{background:rgba(255,255,255,0.08);color:#e2e4e9}
.ib-bulk .approve-all{border-color:rgba(52,211,153,0.2);color:#34d399}
.ib-bulk .approve-all:hover{background:rgba(52,211,153,0.1)}
.ib-bulk .reject-all{border-color:rgba(248,113,113,0.2);color:#f87171}
.ib-bulk .reject-all:hover{background:rgba(248,113,113,0.1)}
.ib-list{padding:8px}
.ib-item{padding:12px 14px;border-radius:10px;margin-bottom:6px;border:1px solid rgba(255,255,255,0.04);transition:all 0.2s ease}
.ib-item:hover{background:rgba(255,255,255,0.03)}
.ib-item-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ib-item-cat{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:2px 6px;border-radius:4px}
.ib-item-source{font-size:10px;color:rgba(255,255,255,0.3);margin-left:auto}
.ib-item-content{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ib-item-actions{display:flex;gap:6px}
.ib-item-actions button{padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:10px;cursor:pointer;transition:all 0.15s ease}
.ib-item-actions .approve{border-color:rgba(52,211,153,0.2);color:#34d399}
.ib-item-actions .approve:hover{background:rgba(52,211,153,0.12)}
.ib-item-actions .reject{border-color:rgba(248,113,113,0.2);color:#f87171}
.ib-item-actions .reject:hover{background:rgba(248,113,113,0.12)}
.ib-item-actions .edit{border-color:rgba(129,140,248,0.2);color:#818cf8}
.ib-item-actions .edit:hover{background:rgba(129,140,248,0.12)}
.ib-empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.25);font-size:12px}

/* Tooltip -- rich card with actions */
#tooltip{position:fixed;z-index:150;padding:10px 14px;border-radius:12px;font-size:12px;color:#e2e4e9;pointer-events:none;opacity:0;transition:opacity 0.2s ease;max-width:320px;background:rgba(12,16,28,0.95);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
#tooltip.visible{opacity:1;pointer-events:auto}
#tooltip .tt-label{font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tooltip .tt-cat{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:2px 6px;border-radius:4px;margin-bottom:6px}
#tooltip .tt-actions{display:flex;gap:6px;margin-top:8px;border-top:1px solid rgba(255,255,255,0.06);padding-top:8px}
#tooltip .tt-actions button{padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);font-size:10px;cursor:pointer;transition:all 0.15s ease;font-family:'Inter',sans-serif}
#tooltip .tt-actions button:hover{background:rgba(255,255,255,0.12);color:#e2e4e9}

/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <div class="text">Loading Engram graph...</div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Topbar -->
<div id="topbar" class="glass">
  <h1><span class="logo-glow"><span>ENGRAM</span></span></h1>
  <div id="search-box">
    <span id="search-icon">&#x1F50D;</span>
    <input type="text" id="search-input" placeholder="Search memories..." autocomplete="off" spellcheck="false">
  </div>
  <div class="stats">
    <span><span class="num" id="stat-nodes">-</span> memories</span>
    <span><span class="num" id="stat-links">-</span> links</span>
  </div>
  <button class="tb-btn" id="inbox-toggle" onclick="toggleInboxPanel()">
    &#x1F4E5; Inbox
    <span id="inbox-badge"></span>
  </button>
</div>

<!-- Canvas -->
<canvas id="bg-canvas"></canvas>
<canvas id="graph"></canvas>

<!-- Navigation controls (bottom-left) -->
<div id="nav-controls">
  <button onclick="fitView()">Fit</button>
  <button onclick="centerView()">Center</button>
  <button onclick="toggleTimelineBar()">Timeline</button>
  <div style="display:flex;gap:6px">
    <button onclick="zoomOut()" style="flex:1">-</button>
    <button onclick="zoomIn()" style="flex:1">+</button>
  </div>
</div>

<!-- Legend (bottom-left, collapsible) -->
<div id="legend-wrap">
  <div id="legend"></div>
  <button id="legend-toggle" onclick="toggleLegend()"><span class="arrow">&#x25B2;</span> Legend</button>
</div>

<!-- Timeline bar -->
<div id="timeline-bar">
  <button id="timeline-btn" onclick="toggleTimeline()">&#x25B6;</button>
  <input type="range" id="timeline-slider" min="0" max="1000" value="1000" oninput="onTimelineSlide(this.value)">
  <span id="timeline-date">All time</span>
  <span id="timeline-count"></span>
</div>

<!-- Detail sidebar -->
<div id="sidebar">
  <div class="sb-header">
    <h2 id="sb-title">Memory Detail</h2>
    <button class="sb-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="sb-body" id="sb-body"></div>
</div>

<!-- Inbox panel -->
<div id="inbox-panel">
  <div class="ib-header">
    <h2>&#x1F4E5; Inbox <span id="inbox-count">0 pending</span></h2>
    <button class="sb-close" onclick="toggleInboxPanel()">&times;</button>
  </div>
  <div class="ib-bulk">
    <button class="approve-all" onclick="inboxBulkApprove()">Approve All</button>
    <button class="reject-all" onclick="inboxBulkReject()">Reject All</button>
  </div>
  <div class="ib-list" id="inbox-list"></div>
</div>

<script>
// ============================================================
// ENGRAM GRAPH GUI v2.0 -- Canvas 2D + D3 Force
// ============================================================

var BASE = location.origin;

// ============================================================
// CATEGORY COLORS
// ============================================================
var CAT_COLORS = {
  task:      { fill: '#7b8fff', bg: 'rgba(123,143,255,0.12)', dim: 'rgba(123,143,255,0.08)' },
  discovery: { fill: '#22d89a', bg: 'rgba(34,216,154,0.12)',  dim: 'rgba(34,216,154,0.08)' },
  decision:  { fill: '#ffc830', bg: 'rgba(255,200,48,0.12)',  dim: 'rgba(255,200,48,0.08)' },
  state:     { fill: '#b28dff', bg: 'rgba(178,141,255,0.12)', dim: 'rgba(178,141,255,0.08)' },
  issue:     { fill: '#f87171', bg: 'rgba(248,113,113,0.12)', dim: 'rgba(248,113,113,0.08)' },
  general:   { fill: '#94a3b8', bg: 'rgba(148,163,184,0.12)', dim: 'rgba(148,163,184,0.08)' },
  entity:    { fill: '#2dd4bf', bg: 'rgba(45,212,191,0.12)',  dim: 'rgba(45,212,191,0.08)' },
  project:   { fill: '#fb923c', bg: 'rgba(251,146,60,0.12)',  dim: 'rgba(251,146,60,0.08)' },
  reference: { fill: '#60a5fa', bg: 'rgba(96,165,250,0.12)',  dim: 'rgba(96,165,250,0.08)' }
};
function catColor(cat) { return CAT_COLORS[cat] || CAT_COLORS.general; }

// ============================================================
// STATE
// ============================================================
var nodes = [];
var links = [];
var nodeMap = {};
var simulation = null;
var selectedNode = null;
var hoveredNode = null;
var searchMatches = null; // Set of node ids, or null if no search active
var dimProgress = 0; // 0..1 for smooth dimming
var dimTarget = 0;

// Camera
var camX = 0, camY = 0, camZoom = 1;
var targetCamX = 0, targetCamY = 0, targetCamZoom = 1;
var camAnimating = false;

// Interaction
var isPanning = false;
var panStartX = 0, panStartY = 0, panCamStartX = 0, panCamStartY = 0;
var isDragging = false;
var dragNode = null;

// Canvas & WebGL
var canvas, gl;
var bgCanvas, bgCtx;
var W, H, dpr;

// Spatial grid for hit detection
var GRID_CELL = 150;
var spatialGrid = {};

// Refresh
var REFRESH_INTERVAL = 60000;
var refreshTimer = null;
var lastNodeCount = 0;
var lastMaxId = 0;

// Inbox
var inboxPanelOpen = false;
var inboxItems = [];

// WebGL shader sources (must be before init IIFE due to var hoisting)
var LINE_VS = `#version 300 es
in vec2 a_pos;
in vec4 a_color;
uniform vec2 u_scale;
uniform vec2 u_offset;
out vec4 v_color;
void main(){
  gl_Position=vec4((a_pos+u_offset)*u_scale,0.0,1.0);
  v_color=a_color;
}`;
var LINE_FS = `#version 300 es
precision mediump float;
in vec4 v_color;
out vec4 fragColor;
void main(){fragColor=v_color;}`;
var POINT_VS = `#version 300 es
in vec2 a_pos;
in vec4 a_color;
in float a_size;
in float a_type;
uniform vec2 u_scale;
uniform vec2 u_offset;
uniform float u_zoom;
uniform float u_dpr;
out vec4 v_color;
out float v_type;
out float v_seed;
void main(){
  gl_Position=vec4((a_pos+u_offset)*u_scale,0.0,1.0);
  gl_PointSize=clamp(a_size*2.0*u_zoom*u_dpr,1.0,512.0);
  v_color=a_color;
  v_type=a_type;
  v_seed=fract(sin(dot(a_pos,vec2(12.9898,78.233)))*43758.5453);
}`;
var POINT_FS = `#version 300 es
precision mediump float;
in vec4 v_color;
in float v_type;
in float v_seed;
out vec4 fragColor;
void main(){
  vec2 c=gl_PointCoord*2.0-1.0;
  float d=length(c);
  if(v_type<0.5){
    // Glow: soft radial falloff
    float a=max(1.0-d,0.0);a=a*a;
    fragColor=vec4(v_color.rgb,v_color.a*a);
  }else if(v_type<1.5){
    // Neuron cell body: organic wobble membrane with bright nucleus
    float angle=atan(c.y,c.x);
    float s1=v_seed*6.283;
    float wobble=sin(angle*3.0+s1)*0.14
                +sin(angle*5.0+s1*1.7)*0.09
                +sin(angle*8.0+s1*2.3)*0.05;
    float cellR=0.52+wobble;
    // Nucleus: bright inner core
    float nucleus=1.0-smoothstep(0.0,cellR*0.45,d);
    // Membrane: organic edge
    float membrane=1.0-smoothstep(cellR-0.08,cellR+0.03,d);
    // Cytoplasm: faint fill between nucleus and membrane
    float cyto=1.0-smoothstep(cellR*0.4,cellR-0.05,d);
    float a=max(nucleus*0.9,membrane*0.8)+cyto*0.15;
    vec3 col=v_color.rgb*(0.6+nucleus*0.6);
    fragColor=vec4(col,v_color.a*clamp(a,0.0,1.0));
  }else if(v_type<2.5){
    // Selection ring
    float ring=abs(d-0.8)-0.08;
    float a=1.0-smoothstep(0.0,0.06,ring);
    fragColor=vec4(v_color.rgb,v_color.a*a);
  }else{
    if(d>1.0)discard;
    fragColor=v_color;
  }
}`;

// GL objects
var lineProgram, pointProgram;
var lineVAO, pointVAO, glowVAO, lineVBO, pointVBO, glowVBO;
var lineLocs = {}, pointLocs = {};

// Pre-allocated vertex buffers

var MAX_POINT_VERTS = 50000;
var MAX_GLOW_VERTS = 10000;
var lineArray = new Float32Array(MAX_LINE_VERTS * 6);
var pointArray = new Float32Array(MAX_POINT_VERTS * 8);
var glowArray = new Float32Array(MAX_GLOW_VERTS * 8);
var lineVertCount = 0, pointVertCount = 0, glowVertCount = 0;

// Alpha cache (rebuilt per frame when dimming active)
var _alphaCache = null;
var _shaderErrors = [];

(function init() {

// ============================================================
// DATA LOADING
// ============================================================
async function loadData() {
  var loadEl = document.getElementById('loading').querySelector('.text');
  try {
    loadEl.textContent = 'Fetching graph...';
    var res = await fetch(BASE + '/graph');
    if (!res.ok) { loadEl.textContent = 'Fetch failed: HTTP ' + res.status; loadEl.style.color = '#f87171'; return; }
    loadEl.textContent = 'Parsing response...';
    var data = await res.json();
    if (data.error) { loadEl.textContent = 'API error: ' + data.error; loadEl.style.color = '#f87171'; return; }
    loadEl.textContent = 'Processing ' + (data.nodes || []).length + ' nodes...';
    processGraphData(data);
    loadEl.textContent = 'Analyzing graph...';
    analyzeGraph();
    initTimeline();
    document.getElementById('stat-nodes').textContent = nodes.length;
    document.getElementById('stat-links').textContent = links.length;
    hideLoading();
    initSimulation();
    scheduleRefresh();
  } catch (e) {
    loadEl.textContent = 'Failed: ' + e.message;
    loadEl.style.color = '#f87171';
    console.error('loadData error:', e);
  }
}

function processGraphData(data) {
  var rawNodes = data.nodes || [];
  var rawLinks = data.links || data.edges || [];

  nodes = rawNodes.map(function(n) {
    var id = n.id;
    // Determine type bucket
    var ntype = 'memory';
    if (typeof id === 'string') {
      if (id.startsWith('e')) ntype = 'entity';
      else if (id.startsWith('p')) ntype = 'project';
    }
    var cat = n.category || n.type || 'general';
    if (ntype === 'entity') cat = 'entity';
    if (ntype === 'project') cat = 'project';

    var imp = n.importance || 0.5;
    var radius = 4 + imp * 8 + (n.source_count || 0) * 0.3;
    if (ntype === 'entity') radius = Math.max(radius, 8);
    if (ntype === 'project') radius = Math.max(radius, 10);
    radius = Math.min(radius, 20);

    return {
      id: id,
      label: n.label || n.content?.substring(0, 50) || String(id),
      content: n.content || '',
      category: cat,
      ntype: ntype,
      importance: imp,
      confidence: n.confidence || 0.5,
      source: n.source || '',
      created_at: n.created_at || '',
      is_archived: n.is_archived || false,
      is_forgotten: n.is_forgotten || false,
      source_count: n.source_count || 0,
      radius: radius,
      x: n.x || (Math.random() - 0.5) * 800,
      y: n.y || (Math.random() - 0.5) * 800,
      vx: 0,
      vy: 0
    };
  });

  nodeMap = {};
  nodes.forEach(function(n) { nodeMap[n.id] = n; });

  links = rawLinks.map(function(l) {
    var src = l.source_id || l.source;
    var tgt = l.target_id || l.target;
    return {
      source: src,
      target: tgt,
      weight: l.weight || l.similarity || 0.5,
      type: l.type || 'similarity'
    };
  }).filter(function(l) {
    // Ensure both endpoints exist
    return nodeMap[l.source] && nodeMap[l.target];
  });
}

async function refreshData() {
  try {
    var res = await fetch(BASE + '/graph');
    var data = await res.json();
    var rawNodes = data.nodes || [];
    var newCount = rawNodes.length;
    var newMaxId = rawNodes.reduce(function(mx, n) {
      var nid = typeof n.id === 'string' ? parseInt(n.id.replace(/\D/g, '')) || 0 : n.id;
      return nid > mx ? nid : mx;
    }, 0);

    if (newCount !== lastNodeCount || newMaxId !== lastMaxId) {
      // Preserve positions of existing nodes
      var oldPositions = {};
      nodes.forEach(function(n) {
        oldPositions[n.id] = { x: n.x, y: n.y };
      });

      processGraphData(data);

      // Restore positions
      nodes.forEach(function(n) {
        if (oldPositions[n.id]) {
          n.x = oldPositions[n.id].x;
          n.y = oldPositions[n.id].y;
        }
      });

      document.getElementById('stat-nodes').textContent = nodes.length;
      document.getElementById('stat-links').textContent = links.length;

      analyzeGraph();
      initTimeline();
      initSimulation();
    }
  } catch (e) {
    console.error('Refresh failed:', e);
  }
  scheduleRefresh();
}

function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshData, REFRESH_INTERVAL);
}

function hideLoading() {
  var el = document.getElementById('loading');
  el.classList.add('hidden');
  setTimeout(function() { el.style.display = 'none'; }, 500);
}

// ============================================================
// D3 FORCE SIMULATION
// ============================================================
function initSimulation() {
  lastNodeCount = nodes.length;
  lastMaxId = nodes.reduce(function(mx, n) {
    var nid = typeof n.id === 'string' ? parseInt(n.id.replace(/\D/g, '')) || 0 : n.id;
    return nid > mx ? nid : mx;
  }, 0);

  if (simulation) simulation.stop();

  simulation = d3.forceSimulation(nodes)
    .alpha(1)
    .alphaDecay(0.015)
    .alphaMin(0.001)
    .velocityDecay(0.35)
    .force('link', d3.forceLink(links)
      .id(function(d) { return d.id; })
      .distance(function(d) { return 30 + (1 - d.weight) * 80; })
      .strength(function(d) { return 0.15 + d.weight * 0.35; })
    )
    .force('charge', d3.forceManyBody()
      .strength(function(d) { return -180 - d.importance * 100; })
      .distanceMax(1000)
    )
    .force('collide', d3.forceCollide()
      .radius(function(d) { return d.radius * 1.5 + 6; })
      .strength(0.7)
    )
    .force('center', d3.forceCenter(0, 0).strength(0.012))
    .force('cluster', function(alpha) {
      // Pull nodes toward their community centroid - creates distinct cluster groups
      var cx = {}, cy = {}, cn = {};
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i], comm = n.community;
        if (comm === undefined) continue;
        cx[comm] = (cx[comm] || 0) + n.x;
        cy[comm] = (cy[comm] || 0) + n.y;
        cn[comm] = (cn[comm] || 0) + 1;
      }
      for (var k in cx) { cx[k] /= cn[k]; cy[k] /= cn[k]; }
      // Attract to centroid
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i], comm = n.community;
        if (cx[comm] === undefined) continue;
        n.vx += (cx[comm] - n.x) * alpha * 0.08;
        n.vy += (cy[comm] - n.y) * alpha * 0.08;
      }
    })
    .on('tick', onSimTick)
    .on('end', onSimEnd);
}

var simRunning = true;
function onSimTick() {
  simRunning = true;
  rebuildSpatialGrid();
  requestRender();
}

function onSimEnd() {
  simRunning = false;
  rebuildSpatialGrid();
  requestRender();
  // Auto-fit on first load
  if (!_hasFitted) {
    _hasFitted = true;
    fitView();
  }
}
var _hasFitted = false;

function reheatSim() {
  if (simulation) {
    simulation.alpha(0.3).restart();
  }
}

// ============================================================
// SPATIAL GRID (O(1) hit detection)
// ============================================================
function rebuildSpatialGrid() {
  spatialGrid = {};
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var cx = Math.floor(n.x / GRID_CELL);
    var cy = Math.floor(n.y / GRID_CELL);
    var key = cx + ',' + cy;
    if (!spatialGrid[key]) spatialGrid[key] = [];
    spatialGrid[key].push(n);
  }
}

function findNodeAt(wx, wy) {
  var cx = Math.floor(wx / GRID_CELL);
  var cy = Math.floor(wy / GRID_CELL);
  var best = null, bestDist = Infinity;

  for (var dx = -1; dx <= 1; dx++) {
    for (var dy = -1; dy <= 1; dy++) {
      var key = (cx + dx) + ',' + (cy + dy);
      var cell = spatialGrid[key];
      if (!cell) continue;
      for (var i = 0; i < cell.length; i++) {
        var n = cell[i];
        var dist = Math.hypot(n.x - wx, n.y - wy);
        // Use a slightly larger hit area for smaller nodes
        var hitR = Math.max(n.radius / camZoom + 4 / camZoom, n.radius);
        if (dist < hitR && dist < bestDist) {
          best = n;
          bestDist = dist;
        }
      }
    }
  }
  return best;
}

// ============================================================
// GRAPH ANALYSIS (communities, centrality, bridges)
// ============================================================
var COMM_PALETTE = [
  [0.30, 0.58, 1.0],
  [0.10, 0.95, 0.55],
  [1.0, 0.65, 0.10],
  [0.65, 0.40, 1.0],
  [1.0, 0.30, 0.35],
  [0.10, 0.90, 0.80],
  [1.0, 0.45, 0.10],
  [0.90, 0.35, 0.70],
  [0.45, 0.90, 0.25],
  [0.25, 0.60, 1.0],
  [1.0, 0.40, 0.55],
  [0.20, 0.85, 0.50],
];
var communityCount = 0;
var communityLabels = {};

function _nodeColor(n) {
  if (n.community !== undefined) return COMM_PALETTE[n.community % COMM_PALETTE.length];
  return [0.55, 0.70, 0.90];
}

function analyzeGraph() {
  if (nodes.length === 0) return;

  // Build adjacency list
  var adj = {};
  nodes.forEach(function(n) { adj[n.id] = []; });
  for (var i = 0; i < links.length; i++) {
    var l = links[i];
    var sid = typeof l.source === 'object' ? l.source.id : l.source;
    var tid = typeof l.target === 'object' ? l.target.id : l.target;
    var w = l.weight || 0.5;
    if (adj[sid]) adj[sid].push({ id: tid, weight: w });
    if (adj[tid]) adj[tid].push({ id: sid, weight: w });
  }

  // Label propagation for community detection
  nodes.forEach(function(n, i) { n.community = i; });
  for (var iter = 0; iter < 30; iter++) {
    var changed = false;
    var order = [];
    for (var i = 0; i < nodes.length; i++) order.push(i);
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    for (var oi = 0; oi < order.length; oi++) {
      var n = nodes[order[oi]];
      var nb = adj[n.id];
      if (!nb || nb.length === 0) continue;
      var cw = {};
      for (var ni = 0; ni < nb.length; ni++) {
        var peer = nodeMap[nb[ni].id];
        if (!peer) continue;
        cw[peer.community] = (cw[peer.community] || 0) + nb[ni].weight;
      }
      var best = n.community, bestW = 0;
      for (var c in cw) { if (cw[c] > bestW) { bestW = cw[c]; best = parseInt(c); } }
      if (best !== n.community) { n.community = best; changed = true; }
    }
    if (!changed) break;
  }

  // Normalize: largest community = 0
  var sizes = {};
  nodes.forEach(function(n) { sizes[n.community] = (sizes[n.community] || 0) + 1; });
  var sorted = Object.keys(sizes).sort(function(a, b) { return sizes[b] - sizes[a]; });
  var remap = {};
  sorted.forEach(function(c, i) { remap[c] = i; });
  nodes.forEach(function(n) { n.community = remap[n.community]; });
  communityCount = sorted.length;

  // Auto-label by dominant category
  communityLabels = {};
  var commCats = {};
  nodes.forEach(function(n) {
    if (!commCats[n.community]) commCats[n.community] = {};
    commCats[n.community][n.category || 'general'] = (commCats[n.community][n.category || 'general'] || 0) + 1;
  });
  for (var c in commCats) {
    var bestCat = 'general', bestN = 0;
    for (var cat in commCats[c]) { if (commCats[c][cat] > bestN) { bestN = commCats[c][cat]; bestCat = cat; } }
    var sz = 0; nodes.forEach(function(n) { if (n.community == c) sz++; });
    communityLabels[c] = bestCat + ' (' + sz + ')';
  }

  // Degree centrality
  var maxDeg = 1;
  nodes.forEach(function(n) {
    n.degree = adj[n.id] ? adj[n.id].length : 0;
    if (n.degree > maxDeg) maxDeg = n.degree;
  });
  nodes.forEach(function(n) { n.centrality = n.degree / maxDeg; });

  // Bridge detection (neighbors in 2+ communities)
  nodes.forEach(function(n) {
    var comms = {};
    var nb = adj[n.id] || [];
    for (var i = 0; i < nb.length; i++) {
      var peer = nodeMap[nb[i].id];
      if (peer) comms[peer.community] = true;
    }
    n.isBridge = Object.keys(comms).length >= 2;
    n.bridgeSpan = Object.keys(comms).length;
  });

  // Adjust radius: centrality + bridge boost
  nodes.forEach(function(n) {
    var base = 8 + (n.importance || 0.5) * 10 + (n.source_count || 0) * 0.5;
    if (n.ntype === 'entity') base = Math.max(base, 14);
    if (n.ntype === 'project') base = Math.max(base, 16);
    base *= (1 + n.centrality * 0.6);
    if (n.isBridge) base *= 1.25;
    n.radius = Math.max(Math.min(base, 35), 10);
    delete n._sats;
  });

  updateCommunityLegend();
  document.getElementById('stat-nodes').textContent = nodes.length + ' (' + communityCount + ' clusters)';
}

function updateCommunityLegend() {
  var legend = document.getElementById('legend');
  var html = '';
  var shown = Math.min(communityCount, 12);
  for (var i = 0; i < shown; i++) {
    var col = COMM_PALETTE[i % COMM_PALETTE.length];
    var rgb = 'rgb(' + Math.round(col[0]*255) + ',' + Math.round(col[1]*255) + ',' + Math.round(col[2]*255) + ')';
    html += '<div class="item"><span class="dot" style="background:' + rgb + '"></span>' + (communityLabels[i] || 'cluster ' + i) + '</div>';
  }
  if (communityCount > 12) html += '<div class="item" style="color:rgba(255,255,255,0.2)">+' + (communityCount - 12) + ' more</div>';
  legend.innerHTML = html;
}

// ============================================================
// RENDERING
// ============================================================
function _compileShader(src, type) {
  src = src.replace(/\r/g, '');
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    var err = gl.getShaderInfoLog(s);
    var label = type === gl.VERTEX_SHADER ? 'VERTEX' : 'FRAGMENT';
    _shaderErrors.push(label + ': ' + err);
    console.error('Shader compile ' + label + ':', err, '\nSource:', src.substring(0, 200));
    gl.deleteShader(s); return null;
  }
  return s;
}

function _linkProgram(vs, fs) {
  if (!vs || !fs) {
    var msg = 'Cannot link: ' + (!vs ? 'vertex shader null' : '') + (!fs ? 'fragment shader null' : '');
    _shaderErrors.push(msg);
    console.error(msg);
    return null;
  }
  var p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    var err = gl.getProgramInfoLog(p);
    _shaderErrors.push('LINK: ' + err);
    console.error('Program link:', err); return null;
  }
  return p;
}

function initGL() {
  var lvs = _compileShader(LINE_VS, gl.VERTEX_SHADER);
  var lfs = _compileShader(LINE_FS, gl.FRAGMENT_SHADER);
  lineProgram = _linkProgram(lvs, lfs);
  lineLocs = {
    a_pos: gl.getAttribLocation(lineProgram, 'a_pos'),
    a_color: gl.getAttribLocation(lineProgram, 'a_color'),
    u_scale: gl.getUniformLocation(lineProgram, 'u_scale'),
    u_offset: gl.getUniformLocation(lineProgram, 'u_offset')
  };
  lineVAO = gl.createVertexArray();
  gl.bindVertexArray(lineVAO);
  lineVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, lineVBO);
  gl.bufferData(gl.ARRAY_BUFFER, lineArray.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(lineLocs.a_pos);
  gl.vertexAttribPointer(lineLocs.a_pos, 2, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(lineLocs.a_color);
  gl.vertexAttribPointer(lineLocs.a_color, 4, gl.FLOAT, false, 24, 8);
  gl.bindVertexArray(null);

  var pvs = _compileShader(POINT_VS, gl.VERTEX_SHADER);
  var pfs = _compileShader(POINT_FS, gl.FRAGMENT_SHADER);
  pointProgram = _linkProgram(pvs, pfs);
  pointLocs = {
    a_pos: gl.getAttribLocation(pointProgram, 'a_pos'),
    a_color: gl.getAttribLocation(pointProgram, 'a_color'),
    a_size: gl.getAttribLocation(pointProgram, 'a_size'),
    a_type: gl.getAttribLocation(pointProgram, 'a_type'),
    u_scale: gl.getUniformLocation(pointProgram, 'u_scale'),
    u_offset: gl.getUniformLocation(pointProgram, 'u_offset'),
    u_zoom: gl.getUniformLocation(pointProgram, 'u_zoom'),
    u_dpr: gl.getUniformLocation(pointProgram, 'u_dpr')
  };
  pointVAO = gl.createVertexArray();
  gl.bindVertexArray(pointVAO);
  pointVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, pointVBO);
  gl.bufferData(gl.ARRAY_BUFFER, pointArray.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(pointLocs.a_pos);
  gl.vertexAttribPointer(pointLocs.a_pos, 2, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(pointLocs.a_color);
  gl.vertexAttribPointer(pointLocs.a_color, 4, gl.FLOAT, false, 32, 8);
  gl.enableVertexAttribArray(pointLocs.a_size);
  gl.vertexAttribPointer(pointLocs.a_size, 1, gl.FLOAT, false, 32, 24);
  gl.enableVertexAttribArray(pointLocs.a_type);
  gl.vertexAttribPointer(pointLocs.a_type, 1, gl.FLOAT, false, 32, 28);
  gl.bindVertexArray(null);

  // Glow VAO (same layout as points, separate buffer for additive pass)
  glowVAO = gl.createVertexArray();
  gl.bindVertexArray(glowVAO);
  glowVBO = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, glowVBO);
  gl.bufferData(gl.ARRAY_BUFFER, glowArray.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(pointLocs.a_pos);
  gl.vertexAttribPointer(pointLocs.a_pos, 2, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(pointLocs.a_color);
  gl.vertexAttribPointer(pointLocs.a_color, 4, gl.FLOAT, false, 32, 8);
  gl.enableVertexAttribArray(pointLocs.a_size);
  gl.vertexAttribPointer(pointLocs.a_size, 1, gl.FLOAT, false, 32, 24);
  gl.enableVertexAttribArray(pointLocs.a_type);
  gl.vertexAttribPointer(pointLocs.a_type, 1, gl.FLOAT, false, 32, 28);
  gl.bindVertexArray(null);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 0);
}

function _precomputeAlphas() {
  if (dimProgress < 0.01) { _alphaCache = null; return; }
  _alphaCache = {};
  var linked = {};
  if (selectedNode) {
    linked[selectedNode.id] = true;
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var sid = typeof l.source === 'object' ? l.source.id : l.source;
      var tid = typeof l.target === 'object' ? l.target.id : l.target;
      if (sid === selectedNode.id) linked[tid] = true;
      if (tid === selectedNode.id) linked[sid] = true;
    }
  }
  var dimAlpha = 1 - dimProgress * 0.85;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var hi = !!linked[n.id];
    if (searchMatches && searchMatches.has(n.id)) hi = true;
    _alphaCache[n.id] = hi ? 1 : dimAlpha;
  }
}

function _getAlpha(id) {
  return _alphaCache ? (_alphaCache[id] !== undefined ? _alphaCache[id] : 1) : 1;
}

var _renderQueued = false;
function requestRender() {
  if (!_renderQueued) {
    _renderQueued = true;
    requestAnimationFrame(render);
  }
}

function render() {
  _renderQueued = false;

  // Smooth camera
  if (camAnimating) {
    var ease = 0.12;
    camX += (targetCamX - camX) * ease;
    camY += (targetCamY - camY) * ease;
    camZoom += (targetCamZoom - camZoom) * ease;
    if (Math.abs(camX - targetCamX) < 0.1 && Math.abs(camY - targetCamY) < 0.1 && Math.abs(camZoom - targetCamZoom) < 0.001) {
      camX = targetCamX; camY = targetCamY; camZoom = targetCamZoom;
      camAnimating = false;
    } else {
      requestRender();
    }
  }

  // Smooth dimming
  dimTarget = (selectedNode || searchMatches) ? 1 : 0;
  if (Math.abs(dimProgress - dimTarget) > 0.01) {
    dimProgress += (dimTarget - dimProgress) * 0.15;
    if (Math.abs(dimProgress - dimTarget) < 0.01) dimProgress = dimTarget;
    requestRender();
  }

  // Pre-compute per-node alphas for dimming
  _precomputeAlphas();

  // Viewport bounds in world coords (for culling)
  var margin = 100;
  var vpL = (-W / 2 - camX * camZoom - margin) / camZoom;
  var vpR = ( W / 2 - camX * camZoom + margin) / camZoom;
  var vpT = (-H / 2 - camY * camZoom - margin) / camZoom;
  var vpB = ( H / 2 - camY * camZoom + margin) / camZoom;

  // Fill vertex buffers
  fillLines(vpL, vpR, vpT, vpB);
  fillPoints(vpL, vpR, vpT, vpB);

  // Clear (transparent - bg canvas shows through)
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // Transform: world coords -> clip space
  var sx = 2 * camZoom / W;
  var sy = -2 * camZoom / H;

  // Draw lines (edges + spoke lines) - single draw call
  if (lineVertCount > 0) {
    gl.useProgram(lineProgram);
    gl.uniform2f(lineLocs.u_scale, sx, sy);
    gl.uniform2f(lineLocs.u_offset, camX, camY);
    gl.bindVertexArray(lineVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, lineVBO);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, lineArray.subarray(0, lineVertCount * 6));
    gl.drawArrays(gl.LINES, 0, lineVertCount);
  }

  // Pass 1: Atmospheric glows (ADDITIVE blend - creates luminous nebula effect)
  if (glowVertCount > 0) {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(pointProgram);
    gl.uniform2f(pointLocs.u_scale, sx, sy);
    gl.uniform2f(pointLocs.u_offset, camX, camY);
    gl.uniform1f(pointLocs.u_zoom, camZoom);
    gl.uniform1f(pointLocs.u_dpr, dpr);
    gl.bindVertexArray(glowVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, glowVBO);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, glowArray.subarray(0, glowVertCount * 8));
    gl.drawArrays(gl.POINTS, 0, glowVertCount);
  }

  // Pass 2: Cores, satellites, rings (NORMAL blend)
  if (pointVertCount > 0) {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(pointProgram);
    gl.uniform2f(pointLocs.u_scale, sx, sy);
    gl.uniform2f(pointLocs.u_offset, camX, camY);
    gl.uniform1f(pointLocs.u_zoom, camZoom);
    gl.uniform1f(pointLocs.u_dpr, dpr);
    gl.bindVertexArray(pointVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, pointVBO);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pointArray.subarray(0, pointVertCount * 8));
    gl.drawArrays(gl.POINTS, 0, pointVertCount);
  }

  gl.bindVertexArray(null);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
}

// Background: drawn once to bgCanvas (2D), only on resize
function drawBackground() {
  var w = W, h = H;
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  bgCtx.fillStyle = '#030510';
  bgCtx.fillRect(0, 0, w, h);

  var grad = bgCtx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, 'rgba(3,5,16,1)');
  grad.addColorStop(0.3, 'rgba(8,8,35,1)');
  grad.addColorStop(0.6, 'rgba(18,10,60,1)');
  grad.addColorStop(1, 'rgba(25,15,80,1)');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, w, h);

  var glow1 = bgCtx.createRadialGradient(w * 0.55, h * 1.15, 0, w * 0.55, h * 1.15, h * 1.0);
  glow1.addColorStop(0, 'rgba(40,70,255,0.55)');
  glow1.addColorStop(0.2, 'rgba(50,60,240,0.35)');
  glow1.addColorStop(0.5, 'rgba(40,30,180,0.18)');
  glow1.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = glow1;
  bgCtx.fillRect(0, 0, w, h);

  var glow2 = bgCtx.createRadialGradient(w * 0.7, h * 0.6, 0, w * 0.7, h * 0.6, h * 0.5);
  glow2.addColorStop(0, 'rgba(80,30,180,0.2)');
  glow2.addColorStop(0.5, 'rgba(50,20,120,0.08)');
  glow2.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = glow2;
  bgCtx.fillRect(0, 0, w, h);

  var glow3 = bgCtx.createRadialGradient(w * 0.2, h * 0.95, 0, w * 0.2, h * 0.95, h * 0.5);
  glow3.addColorStop(0, 'rgba(60,40,180,0.15)');
  glow3.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = glow3;
  bgCtx.fillRect(0, 0, w, h);
}

// Fill line buffer with edges + spoke lines
function fillLines(vpL, vpR, vpT, vpB) {
  var d = lineArray;
  var c = 0;
  var dp = dimProgress;

  // Edges
  for (var i = 0; i < links.length; i++) {
    if (c >= MAX_LINE_VERTS - 2) break;
    var l = links[i];
    var s = typeof l.source === 'object' ? l.source : nodeMap[l.source];
    var t = typeof l.target === 'object' ? l.target : nodeMap[l.target];
    if (!s || !t) continue;
    if (timelineDate && (!_isTimeVisible(s) || !_isTimeVisible(t))) continue;
    var w = l.weight;
    // Filter weak edges to reduce noise
    if (w < 0.2) continue;
    var minX = Math.min(s.x, t.x), maxX = Math.max(s.x, t.x);
    var minY = Math.min(s.y, t.y), maxY = Math.max(s.y, t.y);
    if (maxX < vpL || minX > vpR || maxY < vpT || minY > vpB) continue;

    var isHi = false;
    if (dp > 0.01) {
      if (selectedNode) isHi = (s.id === selectedNode.id || t.id === selectedNode.id);
      if (searchMatches) isHi = isHi || (searchMatches.has(s.id) && searchMatches.has(t.id));
    }

    var sameComm = s.community !== undefined && s.community === t.community;
    var alpha = sameComm ? (0.06 + w * 0.15) : (0.25 + w * 0.5);
    if (dp > 0.01 && !isHi) alpha *= (1 - dp * 0.85);
    if (isHi) alpha = Math.min(alpha * 2.5, 0.9);

    // Cross-community edges: bright white-ish. Same-community: faint community color
    var sc = _nodeColor(s), tc = _nodeColor(t);
    var r, g, b;
    if (sameComm) {
      r = (sc[0] + tc[0]) * 0.5;
      g = (sc[1] + tc[1]) * 0.5;
      b = (sc[2] + tc[2]) * 0.5;
    } else {
      r = (sc[0] + tc[0]) * 0.35 + 0.3;
      g = (sc[1] + tc[1]) * 0.35 + 0.3;
      b = (sc[2] + tc[2]) * 0.35 + 0.3;
    }

    var idx = c * 6;
    d[idx]=s.x; d[idx+1]=s.y; d[idx+2]=r; d[idx+3]=g; d[idx+4]=b; d[idx+5]=alpha;
    d[idx+6]=t.x; d[idx+7]=t.y; d[idx+8]=r; d[idx+9]=g; d[idx+10]=b; d[idx+11]=alpha;
    c += 2;
  }

  // Dendrite branches (neuron shape built from lines, not dots)
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var outerR = n.radius * 4;
    if (n.x - outerR > vpR || n.x + outerR < vpL || n.y - outerR > vpB || n.y + outerR < vpT) continue;
    if (!_isTimeVisible(n)) continue;
    var na = _getAlpha(n.id);
    if (na < 0.01) continue;
    ensureDendrites(n);
    var dd = n._dends;
    var cc = _nodeColor(n);
    var cr = cc[0], cg = cc[1], cb = cc[2];
    for (var di = 0; di < dd.length; di++) {
      if (c >= MAX_LINE_VERTS - 2) break;
      var dendA = dd[di].primary ? 0.5 * na : 0.35 * na;
      var tipA = dd[di].primary ? 0.3 * na : 0.15 * na;
      var idx = c * 6;
      d[idx]=n.x+dd[di].x1; d[idx+1]=n.y+dd[di].y1; d[idx+2]=cr; d[idx+3]=cg; d[idx+4]=cb; d[idx+5]=dendA;
      d[idx+6]=n.x+dd[di].x2; d[idx+7]=n.y+dd[di].y2; d[idx+8]=cr; d[idx+9]=cg; d[idx+10]=cb; d[idx+11]=tipA;
      c += 2;
    }
  }

  lineVertCount = c;
}

// Generate organic dendrite branches per node (neuron-like shape from lines, not dots)
function ensureDendrites(n) {
  if (n._dends) return;
  var seed = 0;
  var idStr = String(n.id);
  for (var i = 0; i < idStr.length; i++) seed = ((seed << 5) - seed + idStr.charCodeAt(i)) | 0;
  function rng() { seed = (seed * 16807 + 0) % 2147483647; return (seed & 0x7fffffff) / 2147483647; }

  var dends = [];
  var count = 3 + Math.floor(rng() * 4 + n.importance * 1.5);
  count = Math.min(count, 8);
  var baseLen = n.radius * 1.8;

  for (var i = 0; i < count; i++) {
    var angle = (i / count) * Math.PI * 2 + (rng() - 0.5) * 0.8;
    var len = baseLen * (0.5 + rng() * 0.8);
    var ex = Math.cos(angle) * len;
    var ey = Math.sin(angle) * len;
    dends.push({ x1: 0, y1: 0, x2: ex, y2: ey, primary: true });

    // Branch: 50% chance
    if (rng() > 0.5) {
      var ba = angle + (rng() - 0.5) * 1.4;
      var bl = len * (0.3 + rng() * 0.5);
      dends.push({ x1: ex, y1: ey, x2: ex + Math.cos(ba) * bl, y2: ey + Math.sin(ba) * bl });
    }
    // Second branch: 25% chance
    if (rng() > 0.75) {
      var ba2 = angle + (rng() - 0.5) * 1.6;
      var bl2 = len * (0.2 + rng() * 0.3);
      dends.push({ x1: ex, y1: ey, x2: ex + Math.cos(ba2) * bl2, y2: ey + Math.sin(ba2) * bl2 });
    }
  }
  n._dends = dends;
}

// Fill point buffers: glows (additive pass) + cores/sats (normal pass)
function fillPoints(vpL, vpR, vpT, vpB) {
  var d = pointArray;  // cores, satellites, rings
  var g = glowArray;   // atmospheric glows (additive blend)
  var c = 0, gc = 0;

  for (var i = 0; i < nodes.length; i++) {
    if (c >= MAX_POINT_VERTS - 35 || gc >= MAX_GLOW_VERTS - 4) break;
    var n = nodes[i];
    var outerR = n.radius * 8;
    if (n.x - outerR > vpR || n.x + outerR < vpL || n.y - outerR > vpB || n.y + outerR < vpT) continue;
    if (!_isTimeVisible(n)) continue;

    var isSelected = selectedNode && n.id === selectedNode.id;
    var isHovered = hoveredNode && n.id === hoveredNode.id;
    var na = _getAlpha(n.id);
    if (na < 0.01) continue;

    var cc = _nodeColor(n);
    var cr = cc[0], cg = cc[1], cb = cc[2];
    var scale = isHovered ? 1.15 : isSelected ? 1.2 : 1;

    // === GLOW BUFFER (additive blend) ===
    // Subtle inner glow behind dandelion
    var atmR = n.radius * 3.0 * scale;
    var gi = gc * 8;
    g[gi]=n.x; g[gi+1]=n.y; g[gi+2]=cr; g[gi+3]=cg; g[gi+4]=cb;
    g[gi+5]=0.12*na; g[gi+6]=atmR; g[gi+7]=0;
    gc++;

    // Hover/select glow
    if ((isHovered || isSelected) && gc < MAX_GLOW_VERTS - 1) {
      var hlR = n.radius * 5.0 * scale;
      gi = gc * 8;
      g[gi]=n.x; g[gi+1]=n.y; g[gi+2]=cr; g[gi+3]=cg; g[gi+4]=cb;
      g[gi+5]=(isHovered?0.25:0.2)*na; g[gi+6]=hlR; g[gi+7]=0;
      gc++;
    }

    // === POINT BUFFER (normal blend) ===
    // Selection ring (type=3)
    if (isSelected) {
      var ringR = n.radius * 3.5 * scale;
      var idx = c * 8;
      d[idx]=n.x; d[idx+1]=n.y; d[idx+2]=1; d[idx+3]=0.85; d[idx+4]=1;
      d[idx+5]=0.6*na; d[idx+6]=ringR; d[idx+7]=3;
      c++;
    }

    // Soma (cell body center) - small bright anchor, dendrites define the shape
    var coreR = Math.max(2, n.radius * 0.22) * scale;
    var idx = c * 8;
    d[idx]=n.x; d[idx+1]=n.y; d[idx+2]=cr; d[idx+3]=cg; d[idx+4]=cb;
    d[idx+5]=1.0*na; d[idx+6]=coreR; d[idx+7]=1;
    c++;
  }

  pointVertCount = c;
  glowVertCount = gc;
}

// ============================================================
// TIMELINE (temporal graph evolution)
// ============================================================
var timelineDate = null;
var timelinePlaying = false;
var timelinePlayTimer = null;
var timelineMinTs = 0;
var timelineMaxTs = 0;

function _isTimeVisible(n) {
  if (!timelineDate) return true;
  if (!n.created_at) return true;
  var t = new Date(n.created_at).getTime();
  return !isNaN(t) ? t <= timelineDate : true;
}

function initTimeline() {
  if (nodes.length === 0) return;
  var min = Infinity, max = -Infinity;
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].created_at) {
      var t = new Date(nodes[i].created_at).getTime();
      if (!isNaN(t)) {
        if (t < min) min = t;
        if (t > max) max = t;
      }
    }
  }
  if (min === Infinity) return;
  timelineMinTs = min;
  timelineMaxTs = max;
}

function toggleTimelineBar() {
  var bar = document.getElementById('timeline-bar');
  var active = bar.classList.toggle('active');
  if (!active) {
    timelineDate = null;
    stopTimelinePlay();
    document.getElementById('timeline-slider').value = 1000;
    document.getElementById('timeline-date').textContent = 'All time';
    document.getElementById('timeline-count').textContent = '';
    requestRender();
  }
}

function onTimelineSlide(val) {
  if (!timelineMinTs) return;
  var frac = val / 1000;
  var ts = timelineMinTs + (timelineMaxTs - timelineMinTs) * frac;
  timelineDate = ts;
  var d = new Date(ts);
  document.getElementById('timeline-date').textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
  var visible = 0;
  for (var i = 0; i < nodes.length; i++) {
    if (_isTimeVisible(nodes[i])) visible++;
  }
  document.getElementById('timeline-count').textContent = visible + ' / ' + nodes.length;
  requestRender();
}

function toggleTimeline() {
  if (timelinePlaying) { stopTimelinePlay(); } else { startTimelinePlay(); }
}

function startTimelinePlay() {
  timelinePlaying = true;
  document.getElementById('timeline-btn').innerHTML = '&#x23F8;';
  var slider = document.getElementById('timeline-slider');
  var val = parseInt(slider.value);
  if (val >= 995) val = 0;
  timelinePlayTimer = setInterval(function() {
    val += 2;
    if (val > 1000) { val = 1000; stopTimelinePlay(); }
    slider.value = val;
    onTimelineSlide(val);
  }, 50);
}

function stopTimelinePlay() {
  timelinePlaying = false;
  document.getElementById('timeline-btn').innerHTML = '&#x25B6;';
  if (timelinePlayTimer) { clearInterval(timelinePlayTimer); timelinePlayTimer = null; }
}

// ============================================================
// INTERACTION
// ============================================================
function screenToWorld(sx, sy) {
  var wx = (sx - W / 2) / camZoom - camX;
  var wy = (sy - H / 2) / camZoom - camY;
  return { x: wx, y: wy };
}

function setupInteraction() {
  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('mouseleave', onMouseLeave);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('dblclick', onDblClick);

  // Touch support
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd);

  // Search
  var searchInput = document.getElementById('search-input');
  var searchTimeout = null;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() { performSearch(searchInput.value); }, 300);
  });
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      clearSearch();
    }
  });
}

function onMouseDown(e) {
  if (e.button !== 0) return;
  var rect = canvas.getBoundingClientRect();
  var sx = e.clientX - rect.left;
  var sy = e.clientY - rect.top;
  var wp = screenToWorld(sx, sy);
  var hit = findNodeAt(wp.x, wp.y);

  if (hit) {
    // Start dragging node
    isDragging = true;
    dragNode = hit;
    hit.fx = hit.x;
    hit.fy = hit.y;
    canvas.classList.add('grabbing');
    reheatSim();
  } else {
    // Start panning
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panCamStartX = camX;
    panCamStartY = camY;
    canvas.classList.add('grabbing');
  }
}

function onMouseMove(e) {
  var rect = canvas.getBoundingClientRect();
  var sx = e.clientX - rect.left;
  var sy = e.clientY - rect.top;

  if (isDragging && dragNode) {
    var wp = screenToWorld(sx, sy);
    dragNode.fx = wp.x;
    dragNode.fy = wp.y;
    requestRender();
    return;
  }

  if (isPanning) {
    var dx = (e.clientX - panStartX) / camZoom;
    var dy = (e.clientY - panStartY) / camZoom;
    camX = panCamStartX + dx;
    camY = panCamStartY + dy;
    targetCamX = camX;
    targetCamY = camY;
    requestRender();
    return;
  }

  // Hover detection
  var wp = screenToWorld(sx, sy);
  var hit = findNodeAt(wp.x, wp.y);
  var tooltip = document.getElementById('tooltip');

  if (hit !== hoveredNode) {
    hoveredNode = hit;
    if (hit) {
      canvas.style.cursor = 'pointer';
      var col = catColor(hit.category);
      var ttHtml = '<div class="tt-label">' + escHtml(hit.label) + '</div>';
      ttHtml += '<span class="tt-cat" style="background:' + col.bg + ';color:' + col.fill + '">' + hit.category + '</span>';
      ttHtml += '<div class="tt-actions">';
      ttHtml += '<button onclick="event.stopPropagation();selectNode(nodeMap[\'' + hit.id + '\'])">Open</button>';
      ttHtml += '<button onclick="event.stopPropagation();jumpToNode(\'' + hit.id + '\')">Focus</button>';
      ttHtml += '</div>';
      tooltip.innerHTML = ttHtml;
      tooltip.classList.add('visible');
    } else {
      canvas.style.cursor = 'grab';
      tooltip.classList.remove('visible');
    }
    requestRender();
  }

  if (hit) {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY - 8) + 'px';
    if (e.clientX + 340 > W) {
      tooltip.style.left = (e.clientX - tooltip.offsetWidth - 14) + 'px';
    }
  }
}

function onMouseUp(e) {
  if (isDragging && dragNode) {
    dragNode.fx = null;
    dragNode.fy = null;

    // If minimal movement, treat as click
    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;
    var wp = screenToWorld(sx, sy);
    var dist = Math.hypot(wp.x - dragNode.x, wp.y - dragNode.y);
    if (dist < dragNode.radius * 2) {
      selectNode(dragNode);
    }

    isDragging = false;
    dragNode = null;
    canvas.classList.remove('grabbing');
    return;
  }

  if (isPanning) {
    // If minimal movement, treat as click to deselect
    var moved = Math.hypot(e.clientX - panStartX, e.clientY - panStartY);
    if (moved < 3) {
      deselectNode();
    }
    isPanning = false;
    canvas.classList.remove('grabbing');
  }
}

function onMouseLeave() {
  isPanning = false;
  isDragging = false;
  if (dragNode) {
    dragNode.fx = null;
    dragNode.fy = null;
    dragNode = null;
  }
  hoveredNode = null;
  canvas.classList.remove('grabbing');
  document.getElementById('tooltip').classList.remove('visible');
  requestRender();
}

function onWheel(e) {
  e.preventDefault();
  var delta = -e.deltaY * 0.001;
  var newZoom = camZoom * (1 + delta);
  newZoom = Math.max(0.05, Math.min(8, newZoom));

  // Zoom toward cursor
  var rect = canvas.getBoundingClientRect();
  var mx = e.clientX - rect.left - W / 2;
  var my = e.clientY - rect.top - H / 2;

  var factor = newZoom / camZoom;
  camX = mx / newZoom + camX - mx / camZoom;
  camY = my / newZoom + camY - my / camZoom;
  camZoom = newZoom;
  targetCamX = camX;
  targetCamY = camY;
  targetCamZoom = camZoom;

  requestRender();
}

function onDblClick(e) {
  var rect = canvas.getBoundingClientRect();
  var sx = e.clientX - rect.left;
  var sy = e.clientY - rect.top;
  var wp = screenToWorld(sx, sy);
  var hit = findNodeAt(wp.x, wp.y);

  if (hit) {
    // Zoom in and center on node
    targetCamX = -hit.x;
    targetCamY = -hit.y;
    targetCamZoom = Math.min(camZoom * 2, 4);
    camAnimating = true;
    selectNode(hit);
    requestRender();
  }
}

// Touch
var _lastTouchDist = 0;
var _touchStartCam = { x: 0, y: 0, zoom: 1 };

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    var t = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var sx = t.clientX - rect.left;
    var sy = t.clientY - rect.top;
    var wp = screenToWorld(sx, sy);
    var hit = findNodeAt(wp.x, wp.y);
    if (hit) {
      isDragging = true;
      dragNode = hit;
      hit.fx = hit.x;
      hit.fy = hit.y;
      reheatSim();
    } else {
      isPanning = true;
      panStartX = t.clientX;
      panStartY = t.clientY;
      panCamStartX = camX;
      panCamStartY = camY;
    }
  } else if (e.touches.length === 2) {
    isPanning = false;
    isDragging = false;
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    _lastTouchDist = Math.hypot(dx, dy);
    _touchStartCam = { x: camX, y: camY, zoom: camZoom };
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    var t = e.touches[0];
    if (isDragging && dragNode) {
      var rect = canvas.getBoundingClientRect();
      var sx = t.clientX - rect.left;
      var sy = t.clientY - rect.top;
      var wp = screenToWorld(sx, sy);
      dragNode.fx = wp.x;
      dragNode.fy = wp.y;
      requestRender();
    } else if (isPanning) {
      var dx = (t.clientX - panStartX) / camZoom;
      var dy = (t.clientY - panStartY) / camZoom;
      camX = panCamStartX + dx;
      camY = panCamStartY + dy;
      targetCamX = camX;
      targetCamY = camY;
      requestRender();
    }
  } else if (e.touches.length === 2) {
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.hypot(dx, dy);
    var scale = dist / _lastTouchDist;
    camZoom = Math.max(0.05, Math.min(8, _touchStartCam.zoom * scale));
    targetCamZoom = camZoom;
    requestRender();
  }
}

function onTouchEnd(e) {
  if (isDragging && dragNode) {
    dragNode.fx = null;
    dragNode.fy = null;
    isDragging = false;
    dragNode = null;
  }
  isPanning = false;
}

// ============================================================
// NAVIGATION
// ============================================================
function zoomIn() {
  targetCamZoom = Math.min(camZoom * 1.5, 8);
  camAnimating = true;
  requestRender();
}

function zoomOut() {
  targetCamZoom = Math.max(camZoom / 1.5, 0.05);
  camAnimating = true;
  requestRender();
}

function fitView() {
  if (nodes.length === 0) return;
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  }
  var graphW = maxX - minX + 100;
  var graphH = maxY - minY + 100;
  var zoomX = (W - 80) / graphW;
  var zoomY = (H - 120) / graphH;
  targetCamZoom = Math.max(0.05, Math.min(2, Math.min(zoomX, zoomY)));
  targetCamX = -(minX + maxX) / 2;
  targetCamY = -(minY + maxY) / 2;
  camAnimating = true;
  requestRender();
}

function centerView() {
  targetCamX = 0;
  targetCamY = 0;
  camAnimating = true;
  requestRender();
}

// ============================================================
// SEARCH
// ============================================================
async function performSearch(query) {
  if (!query || query.trim().length < 2) {
    clearSearch();
    return;
  }

  try {
    var res = await fetch(BASE + '/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query.trim(), limit: 50 })
    });
    var data = await res.json();
    var results = data.results || data.memories || [];
    searchMatches = new Set();
    results.forEach(function(r) {
      var id = r.id;
      // Try matching with m prefix
      if (nodeMap[id]) searchMatches.add(id);
      else if (nodeMap['m' + id]) searchMatches.add('m' + id);
    });

    // Also match by label/content substring locally
    var q = query.trim().toLowerCase();
    nodes.forEach(function(n) {
      if (n.label.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)) {
        searchMatches.add(n.id);
      }
    });

    if (searchMatches.size === 0) {
      searchMatches = null; // No matches, show all
    }
    requestRender();
  } catch (e) {
    console.error('Search failed:', e);
  }
}

function clearSearch() {
  searchMatches = null;
  requestRender();
}

// ============================================================
// NODE SELECTION & SIDEBAR
// ============================================================
function selectNode(n) {
  selectedNode = n;
  openSidebar(n);
  requestRender();
}

function deselectNode() {
  selectedNode = null;
  closeSidebar();
  requestRender();
}

function openSidebar(n) {
  var sb = document.getElementById('sidebar');
  var body = document.getElementById('sb-body');
  var col = catColor(n.category);

  document.getElementById('sb-title').textContent = n.ntype === 'entity' ? 'Entity' : n.ntype === 'project' ? 'Project' : 'Memory Detail';

  var html = '';

  // Category badge
  html += '<div class="sb-field"><span class="sb-badge" style="background:' + col.bg + ';color:' + col.fill + '">' + n.category + '</span>';
  if (n.is_archived) html += ' <span class="sb-badge" style="background:rgba(148,163,184,0.1);color:#94a3b8">archived</span>';
  if (n.is_forgotten) html += ' <span class="sb-badge" style="background:rgba(248,113,113,0.1);color:#f87171">forgotten</span>';
  if (n.community !== undefined) {
    var cc = COMM_PALETTE[n.community % COMM_PALETTE.length];
    var crgb = 'rgb(' + Math.round(cc[0]*255) + ',' + Math.round(cc[1]*255) + ',' + Math.round(cc[2]*255) + ')';
    html += ' <span class="sb-badge" style="background:rgba(' + Math.round(cc[0]*255) + ',' + Math.round(cc[1]*255) + ',' + Math.round(cc[2]*255) + ',0.15);color:' + crgb + '">' + (communityLabels[n.community] || 'cluster ' + n.community) + '</span>';
  }
  if (n.isBridge) html += ' <span class="sb-badge" style="background:rgba(255,140,50,0.15);color:#ff8c32">bridge</span>';
  html += '</div>';

  // Label
  html += '<div class="sb-field"><label>Label</label><div class="value">' + escHtml(n.label) + '</div></div>';

  // Meta
  html += '<div class="sb-meta">';
  html += '<div class="sb-meta-item">ID: <span class="val">' + n.id + '</span></div>';
  html += '<div class="sb-meta-item">Importance: <span class="val">' + n.importance.toFixed(2) + '</span></div>';
  html += '<div class="sb-meta-item">Confidence: <span class="val">' + n.confidence.toFixed(2) + '</span></div>';
  if (n.centrality !== undefined) html += '<div class="sb-meta-item">Centrality: <span class="val">' + n.centrality.toFixed(2) + '</span></div>';
  if (n.degree !== undefined) html += '<div class="sb-meta-item">Connections: <span class="val">' + n.degree + '</span></div>';
  if (n.isBridge) html += '<div class="sb-meta-item">Bridge: <span class="val">spans ' + n.bridgeSpan + ' clusters</span></div>';
  if (n.source) html += '<div class="sb-meta-item">Source: <span class="val">' + escHtml(n.source) + '</span></div>';
  if (n.source_count) html += '<div class="sb-meta-item">Sources: <span class="val">' + n.source_count + '</span></div>';
  if (n.created_at) html += '<div class="sb-meta-item">Created: <span class="val">' + formatDate(n.created_at) + '</span></div>';
  html += '</div>';

  // Content
  if (n.content) {
    html += '<div class="sb-field"><label>Content</label><div class="content">' + escHtml(n.content) + '</div></div>';
  }

  // Linked nodes
  var linked = [];
  for (var i = 0; i < links.length; i++) {
    var l = links[i];
    var sid = typeof l.source === 'object' ? l.source.id : l.source;
    var tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === n.id && nodeMap[tid]) linked.push({ node: nodeMap[tid], weight: l.weight, type: l.type });
    else if (tid === n.id && nodeMap[sid]) linked.push({ node: nodeMap[sid], weight: l.weight, type: l.type });
  }
  linked.sort(function(a, b) { return b.weight - a.weight; });

  if (linked.length > 0) {
    html += '<div class="sb-field"><label>Connected (' + linked.length + ')</label>';
    html += '<ul class="sb-links-list">';
    var shown = Math.min(linked.length, 20);
    for (var j = 0; j < shown; j++) {
      var lk = linked[j];
      var lCol = catColor(lk.node.category);
      html += '<li onclick="jumpToNode(\'' + lk.node.id + '\')">';
      html += '<span class="link-dot" style="background:' + lCol.fill + '"></span>';
      html += '<span>' + escHtml(lk.node.label.substring(0, 40)) + '</span>';
      html += '<span style="margin-left:auto;color:rgba(255,255,255,0.2);font-size:10px">' + lk.weight.toFixed(2) + '</span>';
      html += '</li>';
    }
    if (linked.length > 20) html += '<li style="color:rgba(255,255,255,0.2);cursor:default">... and ' + (linked.length - 20) + ' more</li>';
    html += '</ul></div>';
  }

  // Actions
  if (n.ntype === 'memory') {
    var memId = typeof n.id === 'string' ? n.id.replace(/^m/, '') : n.id;
    html += '<div class="sb-actions">';
    html += '<button onclick="archiveMemory(\'' + memId + '\')">Archive</button>';
    html += '<button class="danger" onclick="deleteMemory(\'' + memId + '\')">Delete</button>';
    html += '</div>';
  }

  body.innerHTML = html;
  sb.classList.add('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

function jumpToNode(id) {
  var n = nodeMap[id];
  if (!n) return;
  targetCamX = -n.x;
  targetCamY = -n.y;
  targetCamZoom = Math.max(camZoom, 1.5);
  camAnimating = true;
  selectNode(n);
  requestRender();
}

// ============================================================
// CRUD OPERATIONS
// ============================================================
async function archiveMemory(id) {
  if (!confirm('Archive memory ' + id + '?')) return;
  try {
    await fetch(BASE + '/memory/' + id + '/archive', { method: 'POST' });
    // Update local state
    var node = nodeMap['m' + id] || nodeMap[id];
    if (node) node.is_archived = true;
    deselectNode();
    requestRender();
  } catch (e) {
    alert('Archive failed: ' + e.message);
  }
}

async function deleteMemory(id) {
  if (!confirm('Delete memory ' + id + '? This cannot be undone.')) return;
  try {
    await fetch(BASE + '/gui/memories/' + id, { method: 'DELETE' });
    // Remove from local state
    var nodeId = nodeMap['m' + id] ? 'm' + id : id;
    nodes = nodes.filter(function(n) { return n.id !== nodeId; });
    links = links.filter(function(l) {
      var sid = typeof l.source === 'object' ? l.source.id : l.source;
      var tid = typeof l.target === 'object' ? l.target.id : l.target;
      return sid !== nodeId && tid !== nodeId;
    });
    delete nodeMap[nodeId];
    deselectNode();
    document.getElementById('stat-nodes').textContent = nodes.length;
    document.getElementById('stat-links').textContent = links.length;
    initSimulation();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

// ============================================================
// INBOX
// ============================================================
function toggleInboxPanel() {
  inboxPanelOpen = !inboxPanelOpen;
  document.getElementById('inbox-panel').classList.toggle('open', inboxPanelOpen);
  document.getElementById('inbox-toggle').classList.toggle('active', inboxPanelOpen);
  if (inboxPanelOpen) loadInbox();
}

async function loadInbox() {
  try {
    var res = await fetch(BASE + '/inbox?limit=100');
    var data = await res.json();
    inboxItems = data.pending || [];
    renderInbox();
    updateInboxBadge(data.total || 0);
  } catch (e) {
    console.error('Inbox load failed:', e);
  }
}

function renderInbox() {
  var container = document.getElementById('inbox-list');
  if (inboxItems.length === 0) {
    container.innerHTML = '<div class="ib-empty">No pending items</div>';
    return;
  }

  var html = '';
  inboxItems.forEach(function(item) {
    var cat = item.category || 'general';
    var col = catColor(cat);
    html += '<div class="ib-item">';
    html += '<div class="ib-item-header">';
    html += '<span class="ib-item-cat" style="background:' + col.bg + ';color:' + col.fill + '">' + cat + '</span>';
    if (item.source) html += '<span class="ib-item-source">' + escHtml(item.source) + '</span>';
    html += '</div>';
    html += '<div class="ib-item-content">' + escHtml(item.content || '') + '</div>';
    html += '<div class="ib-item-actions">';
    html += '<button class="approve" onclick="inboxApprove(' + item.id + ')">Approve</button>';
    html += '<button class="reject" onclick="inboxReject(' + item.id + ')">Reject</button>';
    html += '<button class="edit" onclick="inboxEdit(' + item.id + ')">Edit</button>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function updateInboxBadge(count) {
  var badge = document.getElementById('inbox-badge');
  var countEl = document.getElementById('inbox-count');
  if (count > 0) {
    badge.style.display = 'block';
    badge.textContent = count > 99 ? '99+' : count;
  } else {
    badge.style.display = 'none';
  }
  countEl.textContent = count + ' pending';
}

async function inboxApprove(id) {
  try {
    await fetch(BASE + '/inbox/' + id + '/approve', { method: 'POST' });
    inboxItems = inboxItems.filter(function(i) { return i.id !== id; });
    renderInbox();
    updateInboxBadge(inboxItems.length);
  } catch (e) { console.error('Approve failed:', e); }
}

async function inboxReject(id) {
  var reason = prompt('Rejection reason (optional):');
  try {
    await fetch(BASE + '/inbox/' + id + '/reject', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: reason || '' })
    });
    inboxItems = inboxItems.filter(function(i) { return i.id !== id; });
    renderInbox();
    updateInboxBadge(inboxItems.length);
  } catch (e) { console.error('Reject failed:', e); }
}

async function inboxEdit(id) {
  var item = inboxItems.find(function(i) { return i.id === id; });
  if (!item) return;
  var newContent = prompt('Edit content:', item.content);
  if (newContent === null) return;
  try {
    await fetch(BASE + '/inbox/' + id + '/edit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: newContent })
    });
    item.content = newContent;
    renderInbox();
  } catch (e) { console.error('Edit failed:', e); }
}

async function inboxBulkApprove() {
  if (!confirm('Approve all ' + inboxItems.length + ' pending items?')) return;
  try {
    var ids = inboxItems.map(function(i) { return i.id; });
    await fetch(BASE + '/inbox/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'approve', ids: ids })
    });
    inboxItems = [];
    renderInbox();
    updateInboxBadge(0);
  } catch (e) { console.error('Bulk approve failed:', e); }
}

async function inboxBulkReject() {
  if (!confirm('Reject all ' + inboxItems.length + ' pending items?')) return;
  try {
    var ids = inboxItems.map(function(i) { return i.id; });
    await fetch(BASE + '/inbox/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'reject', ids: ids })
    });
    inboxItems = [];
    renderInbox();
    updateInboxBadge(0);
  } catch (e) { console.error('Bulk reject failed:', e); }
}

function pollInboxBadge() {
  setInterval(async function() {
    try {
      var r = await fetch(BASE + '/inbox?limit=1');
      var d = await r.json();
      updateInboxBadge(d.total || 0);
    } catch (e) {}
  }, 120000);
  // Initial check
  (async function() {
    try {
      var r = await fetch(BASE + '/inbox?limit=1');
      var d = await r.json();
      updateInboxBadge(d.total || 0);
    } catch (e) {}
  })();
}

// ============================================================
// LEGEND
// ============================================================
function buildLegend() {
  var legend = document.getElementById('legend');
  var cats = ['task', 'discovery', 'decision', 'state', 'issue', 'general', 'entity', 'project'];
  var html = '';
  cats.forEach(function(cat) {
    var col = catColor(cat);
    html += '<div class="item"><span class="dot" style="background:' + col.fill + '"></span>' + cat + '</div>';
  });
  legend.innerHTML = html;
}

function toggleLegend() {
  var legend = document.getElementById('legend');
  var btn = document.getElementById('legend-toggle');
  legend.classList.toggle('open');
  btn.classList.toggle('open');
}

// ============================================================
// UTILITIES
// ============================================================
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatDate(s) {
  if (!s) return '';
  try {
    var d = new Date(s);
    var now = new Date();
    var diff = now - d;
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
  } catch (e) { return s; }
}
