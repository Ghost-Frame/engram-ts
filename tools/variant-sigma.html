<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engram - Sigma.js</title>
<script src="https://unpkg.com/graphology@0.26.0/dist/graphology.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#c8ccd4;font-family:'Inter',sans-serif;overflow:hidden;height:100vh}

#sigma-container{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1}

/* Topbar */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(10,14,30,0.85);backdrop-filter:blur(30px) saturate(1.5);border-bottom:1px solid rgba(100,80,200,0.08);box-shadow:0 4px 30px rgba(0,0,0,0.4)}
#topbar h1{font-size:15px;font-weight:700;color:#e2e4e9;letter-spacing:1.5px;white-space:nowrap;text-transform:uppercase}
#topbar h1 span{background:linear-gradient(135deg,#7b8fff 0%,#b28dff 50%,#c084fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-glow{display:inline-block;filter:drop-shadow(0 0 8px rgba(129,140,248,0.3))}
#search-box{flex:1;max-width:380px;position:relative}
#search-box input{width:100%;padding:8px 14px 8px 34px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e2e4e9;font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:all 0.3s ease}
#search-box input:focus{border-color:rgba(129,140,248,0.4);background:rgba(255,255,255,0.07);box-shadow:0 0 0 3px rgba(129,140,248,0.08)}
#search-box input::placeholder{color:rgba(255,255,255,0.25)}
#search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);font-size:14px;pointer-events:none}
.stats{display:flex;gap:14px;align-items:center;font-size:11px;color:rgba(255,255,255,0.4);white-space:nowrap}
.stats .num{color:#b28dff;font-weight:600;font-family:'JetBrains Mono',monospace}

/* Loading */
#loading{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#0a0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.5s ease}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid rgba(129,140,248,0.15);border-top-color:#818cf8;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .text{font-size:13px;color:rgba(255,255,255,0.4)}

/* Legend */
#legend{position:fixed;bottom:20px;left:20px;z-index:50;padding:12px 16px;border-radius:12px;display:flex;flex-wrap:wrap;gap:8px 14px;max-width:400px;font-size:11px;background:rgba(15,20,35,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08)}
#legend .item{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.5)}
#legend .dot{width:10px;height:10px;border-radius:50%}

/* Sidebar */
#sidebar{position:fixed;top:52px;right:0;bottom:0;width:380px;z-index:80;transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;padding:0;background:rgba(10,14,20,0.95);backdrop-filter:blur(30px);border-left:1px solid rgba(255,255,255,0.04)}
#sidebar.open{transform:translateX(0)}
#sidebar .sb-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between}
#sidebar .sb-header h2{font-size:13px;font-weight:600;color:#e2e4e9}
#sidebar .sb-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer;padding:4px;line-height:1}
#sidebar .sb-close:hover{color:#e2e4e9}
#sidebar .sb-body{padding:16px 20px}
.sb-field{margin-bottom:14px}
.sb-field label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:rgba(255,255,255,0.35);display:block;margin-bottom:4px}
.sb-field .value{font-size:13px;color:#e2e4e9;line-height:1.6}
.sb-field .content{font-size:12px;color:rgba(255,255,255,0.7);line-height:1.7;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;max-height:300px;overflow-y:auto;padding:10px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid rgba(255,255,255,0.04)}
.sb-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.sb-connections{margin-top:12px}
.sb-connections h3{font-size:11px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.sb-conn-item{padding:6px 8px;font-size:11px;color:rgba(255,255,255,0.5);cursor:pointer;border-radius:6px;transition:background 0.15s ease;display:flex;align-items:center;gap:8px}
.sb-conn-item:hover{background:rgba(255,255,255,0.04);color:#e2e4e9}
.sb-conn-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* Tooltip */
#tooltip{position:fixed;z-index:150;padding:8px 12px;background:rgba(10,14,20,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:8px;font-size:11px;color:#e2e4e9;pointer-events:none;display:none;max-width:300px;line-height:1.4}
#tooltip .tt-cat{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;opacity:0.5;margin-bottom:2px}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="text">Loading graph...</div>
</div>

<div id="sigma-container"></div>

<div id="topbar">
  <h1><span class="logo-glow">ENGRAM</span></h1>
  <div id="search-box">
    <span id="search-icon">&#x1F50D;</span>
    <input type="text" placeholder="Search memories..." id="search-input">
  </div>
  <div class="stats">
    <span><span class="num" id="stat-nodes">0</span> memories</span>
    <span><span class="num" id="stat-edges">0</span> links</span>
  </div>
</div>

<div id="legend"></div>

<div id="sidebar">
  <div class="sb-header">
    <h2 id="sb-title">Memory</h2>
    <button class="sb-close" onclick="closeSidebar()">&times;</button>
  </div>
  <div class="sb-body" id="sb-body"></div>
</div>

<div id="tooltip"></div>

<script>
var BASE = location.origin;
var CAT_COLORS = {
  task:      '#7b8fff',
  discovery: '#22d89a',
  decision:  '#ffc830',
  state:     '#b28dff',
  issue:     '#f87171',
  general:   '#94a3b8',
  entity:    '#2dd4bf',
  project:   '#fb923c',
  reference: '#60a5fa'
};

var graph = null;
var renderer = null;
var nodeData = {};  // id -> raw node data
var selectedNode = null;
var hoveredNode = null;

// ============================================================
// DATA LOADING
// ============================================================
async function loadData() {
  var loadEl = document.getElementById('loading').querySelector('.text');
  try {
    loadEl.textContent = 'Fetching graph...';
    var res = await fetch(BASE + '/graph');
    if (!res.ok) { loadEl.textContent = 'Fetch failed: ' + res.status; return; }
    var data = await res.json();
    if (data.error) { loadEl.textContent = 'API error: ' + data.error; return; }

    var rawNodes = data.nodes || [];
    var rawEdges = data.links || data.edges || [];
    loadEl.textContent = 'Building graph with ' + rawNodes.length + ' nodes...';

    buildGraph(rawNodes, rawEdges);
    setupRenderer();
    buildLegend();

    document.getElementById('stat-nodes').textContent = rawNodes.length;
    document.getElementById('stat-edges').textContent = rawEdges.length;

    // Hide loading
    var el = document.getElementById('loading');
    el.classList.add('hidden');
    setTimeout(function() { el.style.display = 'none'; }, 500);

    // Run layout
    runLayout();

  } catch (e) {
    loadEl.textContent = 'Failed: ' + e.message;
    console.error(e);
  }
}

// ============================================================
// GRAPH CONSTRUCTION
// ============================================================
function buildGraph(rawNodes, rawEdges) {
  graph = new graphology.Graph({ type: 'undirected' });

  var nodeIds = new Set();

  rawNodes.forEach(function(n) {
    var id = String(n.id);
    var cat = n.category || n.type || 'general';
    var imp = n.importance || 0.5;
    // Normalize importance (API returns 0-10 scale)
    if (imp > 1) imp = imp / 10;
    var color = CAT_COLORS[cat] || CAT_COLORS.general;
    var size = 3 + imp * 8 + (n.source_count || 0) * 0.3;
    if (id.startsWith('e')) { cat = 'entity'; color = CAT_COLORS.entity; size = Math.max(size, 6); }
    if (id.startsWith('p')) { cat = 'project'; color = CAT_COLORS.project; size = Math.max(size, 8); }
    size = Math.min(size, 15);

    nodeData[id] = n;

    graph.addNode(id, {
      label: n.label || (n.content ? n.content.substring(0, 40) : id),
      x: (Math.random() - 0.5) * 100,
      y: (Math.random() - 0.5) * 100,
      size: size,
      color: color,
      category: cat,
      importance: imp,
      borderColor: color,
      type: 'circle'
    });
    nodeIds.add(id);
  });

  var edgeCount = 0;
  rawEdges.forEach(function(e) {
    var src = String(e.source_id || e.source);
    var tgt = String(e.target_id || e.target);
    if (!nodeIds.has(src) || !nodeIds.has(tgt)) return;
    if (src === tgt) return;
    // Skip duplicate edges
    var edgeKey = src < tgt ? src + '-' + tgt : tgt + '-' + src;
    if (graph.hasEdge(edgeKey)) return;

    var w = e.weight || e.similarity || 0.5;
    graph.addEdgeWithKey(edgeKey, src, tgt, {
      weight: w,
      size: w > 0.85 ? 1.5 : w > 0.65 ? 0.8 : 0.3,
      color: w > 0.85 ? 'rgba(255,255,255,0.18)' : w > 0.65 ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.025)',
      type: 'line'
    });
    edgeCount++;
  });
}

// ============================================================
// LAYOUT (ForceAtlas2-like spring layout)
// ============================================================
function runLayout() {
  // Simple spring-embedded layout since we don't have FA2 web worker
  // Runs synchronously in chunks to not block UI
  var iterations = 300;
  var chunk = 10;
  var i = 0;

  function step() {
    for (var c = 0; c < chunk && i < iterations; c++, i++) {
      springIteration(i / iterations);
    }
    if (i < iterations) {
      requestAnimationFrame(step);
    }
  }
  step();
}

function springIteration(progress) {
  var nodes = graph.nodes();
  var n = nodes.length;
  if (n === 0) return;

  // Temperature decreases over time
  var temp = 2.0 * (1 - progress * 0.8);

  // Collect positions
  var pos = {};
  var force = {};
  nodes.forEach(function(id) {
    var attr = graph.getNodeAttributes(id);
    pos[id] = { x: attr.x, y: attr.y };
    force[id] = { x: 0, y: 0 };
  });

  // Repulsion (Barnes-Hut approximation: just use distance cutoff)
  for (var i = 0; i < n; i++) {
    for (var j = i + 1; j < n; j++) {
      var a = nodes[i], b = nodes[j];
      var dx = pos[a].x - pos[b].x;
      var dy = pos[a].y - pos[b].y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
      if (dist > 80) continue; // skip distant pairs
      var repForce = 50 / (dist * dist);
      var fx = dx / dist * repForce;
      var fy = dy / dist * repForce;
      force[a].x += fx; force[a].y += fy;
      force[b].x -= fx; force[b].y -= fy;
    }
  }

  // Attraction along edges
  graph.forEachEdge(function(edge, attr, src, tgt) {
    var dx = pos[tgt].x - pos[src].x;
    var dy = pos[tgt].y - pos[src].y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
    var w = attr.weight || 0.5;
    var idealDist = 5 + (1 - w) * 20;
    var attForce = (dist - idealDist) * 0.01 * (0.5 + w);
    var fx = dx / dist * attForce;
    var fy = dy / dist * attForce;
    force[src].x += fx; force[src].y += fy;
    force[tgt].x -= fx; force[tgt].y -= fy;
  });

  // Gravity toward center
  nodes.forEach(function(id) {
    var dx = -pos[id].x;
    var dy = -pos[id].y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 0.1;
    force[id].x += dx * 0.001;
    force[id].y += dy * 0.001;
  });

  // Apply forces with temperature
  nodes.forEach(function(id) {
    var fx = force[id].x;
    var fy = force[id].y;
    var mag = Math.sqrt(fx * fx + fy * fy) || 1;
    var capped = Math.min(mag, temp);
    var nx = pos[id].x + fx / mag * capped;
    var ny = pos[id].y + fy / mag * capped;
    graph.setNodeAttribute(id, 'x', nx);
    graph.setNodeAttribute(id, 'y', ny);
  });
}

// ============================================================
// SIGMA RENDERER
// ============================================================
function setupRenderer() {
  var container = document.getElementById('sigma-container');

  renderer = new Sigma(graph, container, {
    renderEdgeLabels: false,
    enableEdgeEvents: false,
    defaultNodeColor: '#94a3b8',
    defaultEdgeColor: 'rgba(255,255,255,0.04)',
    labelFont: 'Inter',
    labelSize: 11,
    labelColor: { color: '#c8ccd4' },
    labelDensity: 0.12,
    labelGridCellSize: 100,
    labelRenderedSizeThreshold: 6,
    stagePadding: 40,
    zIndex: true,
    minCameraRatio: 0.03,
    maxCameraRatio: 10,
    // Node rendering
    defaultNodeType: 'circle',
    // Highlight neighbors on hover
    nodeReducer: function(node, data) {
      var res = Object.assign({}, data);
      if (hoveredNode && hoveredNode !== node) {
        if (!graph.hasEdge(hoveredNode, node) && !graph.hasEdge(node, hoveredNode)) {
          res.color = 'rgba(100,100,120,0.15)';
          res.label = '';
        } else {
          res.highlighted = true;
        }
      }
      if (selectedNode && selectedNode !== node) {
        if (!graph.hasEdge(selectedNode, node) && !graph.hasEdge(node, selectedNode)) {
          res.color = 'rgba(100,100,120,0.15)';
          res.label = '';
        } else {
          res.highlighted = true;
        }
      }
      return res;
    },
    edgeReducer: function(edge, data) {
      var res = Object.assign({}, data);
      if (hoveredNode || selectedNode) {
        var active = hoveredNode || selectedNode;
        var extremities = graph.extremities(edge);
        if (extremities[0] !== active && extremities[1] !== active) {
          res.hidden = true;
        } else {
          res.color = 'rgba(255,255,255,0.35)';
          res.size = 1.5;
        }
      }
      return res;
    }
  });

  // Hover
  renderer.on('enterNode', function(e) {
    hoveredNode = e.node;
    showTooltip(e.node, e.event);
    renderer.refresh();
  });
  renderer.on('leaveNode', function() {
    hoveredNode = null;
    hideTooltip();
    renderer.refresh();
  });

  // Click
  renderer.on('clickNode', function(e) {
    selectedNode = e.node;
    openSidebar(e.node);
    renderer.refresh();
  });
  renderer.on('clickStage', function() {
    selectedNode = null;
    closeSidebar();
    renderer.refresh();
  });
}

// ============================================================
// UI: Tooltip
// ============================================================
function showTooltip(nodeId, event) {
  var el = document.getElementById('tooltip');
  var data = nodeData[nodeId];
  if (!data) return;
  var cat = data.category || data.type || 'general';
  var label = data.label || data.content?.substring(0, 60) || nodeId;
  el.innerHTML = '<div class="tt-cat">' + cat + '</div>' + label;
  el.style.display = 'block';
  el.style.left = (event.x + 15) + 'px';
  el.style.top = (event.y + 15) + 'px';
}
function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ============================================================
// UI: Sidebar
// ============================================================
function openSidebar(nodeId) {
  var data = nodeData[nodeId];
  if (!data) return;
  var cat = data.category || data.type || 'general';
  var color = CAT_COLORS[cat] || CAT_COLORS.general;

  document.getElementById('sb-title').textContent = cat.charAt(0).toUpperCase() + cat.slice(1);

  var html = '';
  html += '<div class="sb-field"><label>Category</label><span class="sb-badge" style="background:' + color + '22;color:' + color + '">' + cat + '</span></div>';
  if (data.source) html += '<div class="sb-field"><label>Source</label><div class="value">' + escHtml(data.source) + '</div></div>';
  if (data.created_at) html += '<div class="sb-field"><label>Created</label><div class="value">' + escHtml(data.created_at) + '</div></div>';
  html += '<div class="sb-field"><label>Content</label><div class="content">' + escHtml(data.content || data.label || '') + '</div></div>';

  // Connected nodes
  var neighbors = graph.neighbors(nodeId);
  if (neighbors.length > 0) {
    html += '<div class="sb-connections"><h3>Connected (' + neighbors.length + ')</h3>';
    // Sort by edge weight
    neighbors.sort(function(a, b) {
      var wa = 0, wb = 0;
      try { wa = graph.getEdgeAttribute(graph.edge(nodeId, a) || graph.edge(a, nodeId), 'weight') || 0; } catch(e) {}
      try { wb = graph.getEdgeAttribute(graph.edge(nodeId, b) || graph.edge(b, nodeId), 'weight') || 0; } catch(e) {}
      return wb - wa;
    });
    neighbors.slice(0, 20).forEach(function(nid) {
      var nd = nodeData[nid];
      if (!nd) return;
      var nc = nd.category || nd.type || 'general';
      var ncol = CAT_COLORS[nc] || CAT_COLORS.general;
      var nlabel = nd.label || nd.content?.substring(0, 40) || nid;
      html += '<div class="sb-conn-item" onclick="focusNode(\'' + nid + '\')"><span class="sb-conn-dot" style="background:' + ncol + '"></span>' + escHtml(nlabel) + '</div>';
    });
    html += '</div>';
  }

  document.getElementById('sb-body').innerHTML = html;
  document.getElementById('sidebar').classList.add('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  selectedNode = null;
  if (renderer) renderer.refresh();
}

function focusNode(nodeId) {
  selectedNode = nodeId;
  openSidebar(nodeId);
  // Animate camera to node
  var attr = graph.getNodeAttributes(nodeId);
  renderer.getCamera().animate({ x: attr.x, y: attr.y, ratio: 0.3 }, { duration: 400 });
  renderer.refresh();
}

// ============================================================
// UI: Search
// ============================================================
document.getElementById('search-input').addEventListener('input', function(e) {
  var query = e.target.value.toLowerCase().trim();
  if (!query) {
    // Reset all nodes
    graph.forEachNode(function(id, attr) {
      var data = nodeData[id];
      var cat = data?.category || 'general';
      graph.setNodeAttribute(id, 'color', CAT_COLORS[cat] || CAT_COLORS.general);
      graph.setNodeAttribute(id, 'hidden', false);
    });
    renderer.refresh();
    return;
  }

  var matchCount = 0;
  graph.forEachNode(function(id, attr) {
    var data = nodeData[id];
    var text = ((data?.label || '') + ' ' + (data?.content || '') + ' ' + (data?.category || '')).toLowerCase();
    var match = text.includes(query);
    if (match) matchCount++;
    graph.setNodeAttribute(id, 'hidden', !match);
  });
  renderer.refresh();
});

// ============================================================
// UI: Legend
// ============================================================
function buildLegend() {
  var el = document.getElementById('legend');
  var html = '';
  for (var cat in CAT_COLORS) {
    html += '<div class="item"><span class="dot" style="background:' + CAT_COLORS[cat] + '"></span>' + cat + '</div>';
  }
  el.innerHTML = html;
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// INIT
// ============================================================
loadData();
</script>
</body>
</html>
